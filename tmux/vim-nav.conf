# Vim-style pane navigation — additive overlay.
#
# Omarchy navigates panes with Ctrl+Alt+arrows and repurposes the vim letters:
# `prefix h` splits vertically and `prefix k` kills the window. Rebinding those
# would diverge from Omarchy's scheme; instead this adds navigation on
# `prefix Ctrl+h/j/k/l`, which Omarchy leaves unbound.
#
# How this file reaches each machine:
#
#   Omarchy    symlinked to ~/.tmux.conf. tmux loads ~/.tmux.conf BEFORE
#              $XDG_CONFIG_HOME/tmux/tmux.conf, and Omarchy never rebinds these
#              keys, so the bindings survive. Omarchy's own config stays
#              untouched and keeps getting updates.
#
#   Elsewhere  symlinked to ~/.tmux.vim-nav.conf and sourced at the end of
#              tmux/tmux.conf.
#
# Keep this file standalone-loadable — on Omarchy it IS the whole of
# ~/.tmux.conf, so it must not depend on anything tmux/tmux.conf sets.

bind -N "Focus pane left"  C-h select-pane -L
bind -N "Focus pane down"  C-j select-pane -D
bind -N "Focus pane up"    C-k select-pane -U
bind -N "Focus pane right" C-l select-pane -R
